name: Validate research project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate datasets and notebook syntax
        run: python scripts/validate_project.py
      - name: Execute all notebooks and save outputs
        working-directory: Notebooks
        run: |
          for notebook in *.ipynb; do
            echo "Executing $notebook"
            jupyter nbconvert --to notebook --execute "$notebook" \
              --ExecutePreprocessor.timeout=300 \
              --inplace
          done
      - name: Commit executed notebook outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Notebooks/*.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "Save executed notebook outputs"
            git push
          else
            echo "Notebook outputs are already up to date."
          fi
